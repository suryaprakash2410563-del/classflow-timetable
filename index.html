<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClassFlow — Physical Class Timetable</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f7fb,#0c1220);--surface:light-dark(#fff,#121a2a);--surface2:light-dark(#eef3fa,#1a2437);--text:light-dark(#172033,#eef3ff);--muted:light-dark(#667085,#aab6ca);--border:light-dark(#dce3ee,#29364d);--accent:#4f46e5;--green:#16a34a;--orange:#ea8a00}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}#app{min-height:100vh;background:var(--bg)}
header{padding:28px 6vw 18px;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--border);background:var(--surface)}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}.clock{text-align:right}.clock strong{display:block;font-size:18px}.clock span{color:var(--muted);font-size:12px}
main{max-width:1200px;margin:auto;padding:28px 6vw 50px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.hero h2{margin:0;font-size:32px}.hero p{margin:7px 0 0;color:var(--muted)}button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 14px;font-weight:650;cursor:pointer}button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:22px}.day{padding:13px 8px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;cursor:pointer}.day small{display:block;color:var(--muted);font-size:11px}.day.active{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 15%,transparent)}.day b{font-size:15px}
.now{padding:16px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--border);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:18px}.now .live{color:var(--green);font-weight:800;font-size:12px}.now h3{margin:5px 0 0}.now p{margin:3px 0 0;color:var(--muted);font-size:13px}.progress{height:7px;background:var(--surface2);border-radius:20px;overflow:hidden;margin-top:10px}.bar{height:100%;background:var(--green);width:63%}
.grid{display:grid;gap:12px}.class{display:grid;grid-template-columns:115px 1fr auto;gap:18px;align-items:center;padding:17px;background:var(--surface);border:1px solid var(--border);border-radius:14px}.time{font-weight:750}.time small{display:block;color:var(--muted);font-weight:500;margin-top:4px}.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:var(--surface2);color:var(--muted);display:inline-block}.class h3{margin:0 0 6px;font-size:16px}.meta{color:var(--muted);font-size:13px}.join{background:var(--accent);color:#fff;border-color:var(--accent)}.join[disabled]{opacity:.45;cursor:not-allowed}.empty{padding:40px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:14px}
@media(max-width:700px){header{padding:20px}.clock{display:none}main{padding:22px 16px}.hero{align-items:start}.hero h2{font-size:26px}.days{grid-template-columns:repeat(7,90px);overflow:auto;padding-bottom:4px}.class{grid-template-columns:90px 1fr}.class .join{grid-column:2;justify-self:start}.now{align-items:start;flex-direction:column}.tabs button{white-space:nowrap}}
</style></head>
<body><div id="app">
<header><div class="brand"><div class="logo">CF</div><div><h1>ClassFlow</h1><p>Physical classroom timetable</p></div></div><div style="display:flex;align-items:center;gap:16px"><button id="adminBtn">Admin Login</button><div class="clock"><strong id="clock">--:--:--</strong><span id="date">Loading date…</span></div></div></header>
<main><div class="hero"><div><h2 id="title">Today’s Classes</h2><p>See your physical classes, faculty and classroom locations.</p></div><div class="tabs"><button class="active" data-view="today">Today</button><button data-view="week">Week</button></div></div>
<div id="days" class="days"></div><section id="now"></section><section id="classes" class="grid"></section><section id="adminPanel" class="empty" style="display:none;margin-top:20px;text-align:left"><h3>Admin timetable editor</h3><p class="meta">Signed in as <span id="adminEmail"></span>. Changes are saved to the Supabase database.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="addClass">Add class</button><button id="logoutBtn">Sign out</button></div></section></main></div>
<div id="loginModal" style="display:none;position:fixed;inset:0;background:#0008;z-index:20;place-items:center;padding:20px"><div style="max-width:390px;width:100%;padding:24px;background:var(--surface);border:1px solid var(--border);border-radius:16px"><h2 style="margin-top:0">Admin Login</h2><p class="meta">Only authorized accounts can edit the timetable.</p><input id="email" type="email" placeholder="Admin email" style="width:100%;padding:12px;margin:7px 0;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text)"><input id="password" type="password" placeholder="Password" style="width:100%;padding:12px;margin:7px 0 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text)"><div style="display:flex;gap:8px"><button id="loginBtn" class="join">Sign in</button><button id="closeLogin">Cancel</button></div><p id="loginMsg" class="meta" style="margin-bottom:0"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* GitHub + Supabase setup:
   1. Create a Supabase project.
   2. Create table: classes(id bigint generated by default as identity primary key, day text, start_time time, end_time time, subject text, faculty text, room text).
   3. Enable Email/Password Auth and create your admin account.
   4. Add RLS policies: public SELECT on classes; authenticated INSERT/UPDATE/DELETE on classes.
   5. Replace the two placeholders below with your Supabase project URL and anon/publishable key.
*/
const SUPABASE_URL='https://ktrmmgtncntsiraudaqz.supabase.co';const SUPABASE_KEY='sb_publishable_e9Ubtr-V3pTcpwUyoRDDow_1EtfVewq';
const db=(window.supabase&&SUPABASE_URL.startsWith('http'))?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const schedule={};const names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];let selected=new Date().getDay();let view='today';let adminUser=null;
function dayKey(i){return names[i]}
function renderDays(){let el=document.getElementById('days');el.innerHTML='';for(let i=1;i<=6;i++){let d=document.createElement('div');d.className='day '+(i===selected?'active':'');d.innerHTML=`<small>${names[i]}</small><b>${i}</b>`;d.onclick=()=>{selected=i;view='today';document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.view==='today'));render()};el.appendChild(d)}}
function mins(s){let [h,m]=s.split(':').map(Number);return h*60+m}function nowMin(){let d=new Date();return d.getHours()*60+d.getMinutes()}
function renderNow(list){let now=nowMin();let cur=list.find(x=>mins(x[0])<=now&&now<mins(x[1]));let el=document.getElementById('now');if(!cur){el.innerHTML='<div class="empty">No class is happening right now.</div>';return}let pct=Math.max(0,Math.min(100,(now-mins(cur[0]))/(mins(cur[1])-mins(cur[0]))*100));el.innerHTML=`<div class="now"><div style="flex:1"><span class="live">● CLASS IN PROGRESS</span><h3>${cur[2]}</h3><p>${cur[0]}–${cur[1]} · ${cur[3]} · ${cur[4]}</p><div class="progress"><div class="bar" style="width:${pct}%"></div></div></div><span class="badge">Physical Class</span></div>`}
function renderList(day,list){let el=document.getElementById('classes');document.getElementById('title').textContent=view==='week'?'Weekly Timetable':`Today’s Classes · ${day}`;if(view==='week'){let all=[];Object.entries(schedule).forEach(([d,items])=>items.forEach(x=>all.push([d,...x])));el.innerHTML=all.map(x=>`<div class="class"><div class="time">${x[0]}<small>${x[1]}–${x[2]}</small></div><div><h3>${x[3]}</h3><span class="meta">${x[4]} · ${x[5]}</span></div><span class="badge">Physical</span></div>`).join('');return}el.innerHTML=list.length?list.map(x=>`<div class="class"><div class="time">${x[0]}<small>${x[1]}</small></div><div><h3>${x[2]}</h3><span class="meta">${x[3]} · ${x[4]}</span></div><span class="badge">Physical Class</span></div>`).join(''):'<div class="empty">No classes scheduled for this day.</div>'}
async function loadSchedule(){Object.keys(schedule).forEach(k=>delete schedule[k]);if(!db){schedule.Mon=[['09:00','10:00','Heat Transfer','Dr. Kumar','Room 204']];render();return}let {data,error}=await db.from('classes').select('*').order('start_time');if(error){document.getElementById('classes').innerHTML='<div class="empty">Connect Supabase to load the timetable.</div>';return}data.forEach(r=>{let day=r.day.slice(0,3);(schedule[day]??=[]).push([String(r.start_time).slice(0,5),String(r.end_time).slice(0,5),r.subject,r.faculty,r.room,r.id])});render()}
function render(){renderDays();let key=dayKey(selected),list=schedule[key]||[];renderNow(list);renderList(key,list)}
function tick(){let d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString();document.getElementById('date').textContent=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});if(view==='today')render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));render()});
document.getElementById('adminBtn').onclick=async()=>{if(adminUser){document.getElementById('adminPanel').style.display='block';return}document.getElementById('loginModal').style.display='grid'};
document.getElementById('closeLogin').onclick=()=>document.getElementById('loginModal').style.display='none';
document.getElementById('loginBtn').onclick=async()=>{let msg=document.getElementById('loginMsg');if(!db){msg.textContent='Add your Supabase URL and key first.';return}let {data,error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){msg.textContent=error.message;return}adminUser=data.user;document.getElementById('loginModal').style.display='none';document.getElementById('adminPanel').style.display='block';document.getElementById('adminEmail').textContent=adminUser.email};
document.getElementById('logoutBtn').onclick=async()=>{if(db)await db.auth.signOut();adminUser=null;document.getElementById('adminPanel').style.display='none';document.getElementById('adminBtn').textContent='Admin Login'};
document.getElementById('addClass').onclick=async()=>{if(!adminUser||!db)return;let day=prompt('Day (Mon/Tue/Wed/Thu/Fri/Sat)',dayKey(selected));let start=prompt('Start time (HH:MM)');let end=prompt('End time (HH:MM)');let subject=prompt('Subject');let faculty=prompt('Faculty');let room=prompt('Room / Lab');if(!day||!start||!end||!subject||!faculty||!room)return;let {error}=await db.from('classes').insert({day,start_time:start,end_time:end,subject,faculty,room});if(error)alert(error.message);else await loadSchedule()};
if(db){db.auth.getSession().then(({data})=>{if(data.session){adminUser=data.session.user;document.getElementById('adminPanel').style.display='block';document.getElementById('adminEmail').textContent=adminUser.email}})}
loadSchedule();tick();setInterval(tick,1000);
</script></body></html>
